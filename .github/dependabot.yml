# Weekly on Monday so auto-merge of safe bumps lands early in the week.
version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    groups:
      types:
        patterns:
          - "@types/*"
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "@typescript-eslint/*"
      typescript:
        patterns:
          - "typescript"
          - "ts-node"
          - "ts-jest"
      jest:
        patterns:
          - "jest*"
          - "@jest/*"
          - "babel-jest"
      tsup:
        patterns:
          - "tsup"
          - "esbuild"
      development-minor-patch:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
      production-patch:
        dependency-type: "production"
        update-types:
          - "patch"

