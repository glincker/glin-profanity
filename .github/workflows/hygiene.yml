name: Hygiene

# welcome: greets first-time PR authors (issues are left alone).
# stale-prs: nightly sweep, 30 days to stale then 7 more to close. Issues are out of scope.

on:
  pull_request_target:
    types: [opened]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  welcome:
    name: Welcome first-time contributors
    if: github.event_name == 'pull_request_target' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          # Required by the action even though this job never runs on issue events.
          issue_message: "Thanks for opening your first issue!"
          pr_message: |
            Thanks for opening your first pull request to glin-profanity! Please check the README and the PR template checklist (tests, docs, and the affected package). A maintainer will take a look soon.

  stale-prs:
    name: Mark and close stale PRs
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/stale@v11
        with:
          days-before-issue-stale: -1
          days-before-issue-close: -1
          days-before-pr-stale: 30
          days-before-pr-close: 7
          stale-pr-label: stale
          exempt-pr-labels: "pinned,security,work-in-progress,blocked-on-maintainer,dependencies"
          remove-stale-when-updated: true
          stale-pr-message: |
            This pull request has had no activity for 30 days, so it is marked **stale**. It will close automatically in **7 days** if nothing changes.

            Push a commit or leave a comment to keep it open.
          close-pr-message: |
            Closing after 37 days of inactivity. Feel free to reopen or open a fresh PR when you are ready to pick this back up.
