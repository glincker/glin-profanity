name: 🔍 CI - Test & Build

on:
  pull_request:
    branches: 
      - main
      - 'release/**'
    paths:
      - 'packages/**'
      - '.github/workflows/**'
      - 'package*.json'
      - 'shared/**'
  push:
    branches:
      - main
    paths:
      - 'packages/**'
      - '.github/workflows/**'
      - 'package*.json'
      - 'shared/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '18'
  PACKAGE_DIR: './packages/glin-profanity'

jobs:
  test:
    name: 🧪 Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    outputs:
      coverage-percentage: ${{ steps.coverage.outputs.percentage }}
      
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Needed for codecov and semantic-release
          
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'
          
      - name: 🔧 Install dependencies
        run: npm ci
        
      - name: 📋 Lint & Type Check
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          # Run TypeScript compiler for type checking
          npx tsc --noEmit
          
      - name: 🏗️ Build package
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          echo "::group::Building package"
          npm run build
          echo "::endgroup::"
          
          echo "::group::Verifying build outputs"
          ls -la dist/
          echo "::endgroup::"
          
      - name: 🧪 Run tests with coverage
        working-directory: ${{ env.PACKAGE_DIR }}
        run: npm run test:ci
        
      - name: 📊 Extract coverage percentage
        id: coverage
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          # Coverage already generated from test:ci, just extract percentage
          if [ -f coverage/lcov.info ]; then
            COVERAGE=$(grep -o 'LF:[0-9]*' coverage/lcov.info | head -1 | cut -d: -f2)
            echo "percentage=${COVERAGE:-0}" >> $GITHUB_OUTPUT
            echo "Coverage data found"
          else
            echo "percentage=0" >> $GITHUB_OUTPUT
            echo "No coverage data found"
          fi
          
      - name: 📈 Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ${{ env.PACKAGE_DIR }}/coverage/lcov.info
          flags: glin-profanity
          name: glin-profanity-coverage
          fail_ci_if_error: false
          verbose: true
          
      - name: 💾 Upload build artifacts
        uses: actions/upload-artifact@v6
        with:
          name: build-artifacts-${{ github.sha }}
          path: |
            ${{ env.PACKAGE_DIR }}/dist/
            ${{ env.PACKAGE_DIR }}/coverage/
          retention-days: 7
          
      - name: 💾 Upload test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: test-results-${{ github.sha }}
          path: |
            ${{ env.PACKAGE_DIR }}/coverage/
            ${{ env.PACKAGE_DIR }}/jest-results.json
          retention-days: 7

  summary:
    name: 📋 CI Summary
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    
    steps:
      - name: ✅ Success Summary
        if: needs.test.result == 'success'
        run: |
          echo "## ✅ CI Passed!" >> $GITHUB_STEP_SUMMARY
          echo "- 🏗️ Build: Success" >> $GITHUB_STEP_SUMMARY
          echo "- 🧪 Tests: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- 📊 Coverage: ${{ needs.test.outputs.coverage-percentage }}%" >> $GITHUB_STEP_SUMMARY
          echo "- 🔒 Security: Dependency review in separate workflow" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Ready for review! 🚀" >> $GITHUB_STEP_SUMMARY
          
      - name: ❌ Failure Summary  
        if: needs.test.result == 'failure'
        run: |
          echo "## ❌ CI Failed" >> $GITHUB_STEP_SUMMARY
          echo "Please check the failed jobs and fix the issues." >> $GITHUB_STEP_SUMMARY
          exit 1