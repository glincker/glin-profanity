name: Bug Report
description: Report a bug in the JS, Python, MCP or OpenClaw package
labels: ["bug"]
title: "Bug: "

body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "glin-profanity (JavaScript / TypeScript)"
        - "glin-profanity (Python)"
        - "MCP server"
        - "OpenClaw plugin"
        - "Other"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `npm list glin-profanity` or `pip show glin-profanity`
      placeholder: e.g. 3.0.0
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear description of the bug
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Code, config and input text that triggers the bug
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      description: Runtime, OS, bundler or framework
      placeholder: "Node 20, macOS, Next.js 15"
    validations:
      required: false
