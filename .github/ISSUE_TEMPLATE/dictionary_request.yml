name: Dictionary / Language Request
description: Report a false positive, a missed word, or request a new language
labels: ["enhancement", "dictionaries"]
title: "Dictionary: "

body:
  - type: dropdown
    id: kind
    attributes:
      label: Type of report
      options:
        - "False positive (clean text was flagged)"
        - "Missed word (profanity was not flagged)"
        - "New language request"
        - "Obfuscation or evasion variant"
    validations:
      required: true

  - type: input
    id: language
    attributes:
      label: Language
      placeholder: e.g. English, German, Hindi (romanized)
    validations:
      required: true

  - type: textarea
    id: input
    attributes:
      label: Input text
      description: The exact text you checked. Keep it as short as possible and redact anything private.
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Which word(s) should or should not be flagged, and why
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: Options used
      description: Languages, severity, `wordBoundaries`, leetspeak or other options passed to the filter
      render: json
    validations:
      required: false

  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: For a new language or word list, links to a reputable source or native speaker context
    validations:
      required: false
